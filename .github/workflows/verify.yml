name: Verify TravelFit

on:
  pull_request:
  push:
    branches: [master, release/fitness-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm version
        run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Build production JavaScript bundle
        run: |
          npm run bundle:ios -- \
            --bundle-output "$RUNNER_TEMP/travelfit-main.jsbundle" \
            --assets-dest "$RUNNER_TEMP/travelfit-assets" \
            --max-workers 2
      - name: Verify Cloud Functions dependencies and syntax
        run: |
          npm ci --prefix functions --engine-strict
          node --check functions/index.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify account flows against local Firebase emulators
        run: |
          npx --yes firebase-tools@15.37.0 emulators:exec \
            --project demo-travelfit-audit --only auth,database,functions \
            'node scripts/verify-firebase.cjs'
  ios-simulator:
    if: github.ref == 'refs/heads/release/fitness-recovery'
    # The legacy Podfile excludes arm64 for simulator builds.
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      RCT_NO_LAUNCH_PACKAGER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install JavaScript dependencies
        run: |
          npm install --global npm@10.9.4
          npm ci
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Select Xcode 26
        id: xcode
        run: |
          xcode=$(ruby -e 'puts Dir["/Applications/Xcode_26*.app"].max_by { |path| File.basename(path).scan(/\d+/).map(&:to_i) }')
          test -n "$xcode"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "build=$(xcodebuild -version | awk '/^Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      - name: Restore CocoaPods downloads
        id: pod-downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: travelfit-pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: travelfit-pods-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore installed CocoaPods
        id: installed-pods
        uses: actions/cache/restore@v4
        with:
          path: ios/Pods
          key: travelfit-installed-pods-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('package-lock.json', 'Gemfile.lock', 'ios/Podfile.lock', 'ios/TravelFit.xcodeproj/project.pbxproj') }}
          restore-keys: travelfit-installed-pods-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-
      - name: Install locked iOS dependencies
        working-directory: ios
        run: bundle exec pod install --deployment
      - name: Save installed CocoaPods
        if: steps.installed-pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/Pods
          key: ${{ steps.installed-pods.outputs.cache-primary-key }}
      - name: Save CocoaPods downloads
        if: steps.pod-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ steps.pod-downloads.outputs.cache-primary-key }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure the simulator-only Firebase and Health fixtures
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          config = {
              "API_KEY": "AIza" + "0" * 35,
              "BUNDLE_ID": "com.travelfit.app",
              "DATABASE_URL": "https://demo-travelfit-audit.firebaseio.com",
              "GCM_SENDER_ID": "100000000000",
              "GOOGLE_APP_ID": "1:100000000000:ios:0000000000000000000000",
              "IS_ANALYTICS_ENABLED": False,
              "PLIST_VERSION": "1",
              "PROJECT_ID": "demo-travelfit-audit",
          }
          with open("ios/GoogleService-Info.local.plist", "wb") as file:
              plistlib.dump(config, file)

          entry = Path("index.js")
          original = entry.read_text()
          gesture_handler = "import 'react-native-gesture-handler'\n"
          assert original.startswith(gesture_handler)
          entry.write_text(original.replace(
              gesture_handler,
              gesture_handler + "import './scripts/ios-simulator-fixture'\n",
              1
          ))

          info = Path("ios/TravelFit/Info.plist")
          with info.open("rb") as file:
              simulator_info = plistlib.load(file)
          simulator_info.setdefault("NSAppTransportSecurity", {})["NSAllowsLocalNetworking"] = True
          with info.open("wb") as file:
              plistlib.dump(simulator_info, file)
          PY
          bundle exec ruby scripts/configure-ios-ui-tests.rb
      - name: Restore native simulator build
        id: native-build
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/travelfit-derived-data/Build
            ${{ runner.temp }}/travelfit-derived-data/ModuleCache.noindex
          key: travelfit-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('package-lock.json', 'ios/Podfile.lock') }}-${{ github.sha }}
          restore-keys: travelfit-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('package-lock.json', 'ios/Podfile.lock') }}-
      - name: Run TravelFit end to end in the Release simulator
        id: simulator
        run: |
          npm ci --prefix functions --engine-strict
          npx --yes firebase-tools@15.37.0 emulators:exec \
            --project demo-travelfit-audit --only auth,database,functions \
            'bash scripts/run-ios-simulator-e2e.sh'
      - name: Report simulator failure diagnostics
        if: failure()
        run: |
          result="$RUNNER_TEMP/travelfit-ios.xcresult"
          if [ -d "$result" ]; then
            xcrun xcresulttool get build-results --path "$result" || true
            xcrun xcresulttool get test-results summary --path "$result" || true
          fi
      - name: Save native simulator build
        if: ${{ !cancelled() && steps.native-build.outputs.cache-hit != 'true' && (steps.simulator.outcome == 'success' || steps.simulator.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/travelfit-derived-data/Build
            ${{ runner.temp }}/travelfit-derived-data/ModuleCache.noindex
          key: ${{ steps.native-build.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-result
          path: ${{ runner.temp }}/travelfit-ios.xcresult
          if-no-files-found: ignore
      - name: Export simulator screenshots
        if: always()
        run: |
          result="$RUNNER_TEMP/travelfit-ios.xcresult"
          if [ -d "$result" ]; then
            xcrun xcresulttool export attachments \
              --path "$result" \
              --output-path "$RUNNER_TEMP/travelfit-ios-attachments"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-attachments
          path: ${{ runner.temp }}/travelfit-ios-attachments
          if-no-files-found: ignore
